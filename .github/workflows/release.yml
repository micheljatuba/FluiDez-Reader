name: Release

# Publishes the firmware devices install from Settings > System > Check for Updates
# (src/network/OtaUpdater.cpp reads this repository's latest release). Push a tag
# such as v1.6-fluidez9 from main, or run this workflow on main with 1.6-fluidez9.
# The release page opens with the version's section of NOVIDADES.md.
on:
  push:
    tags:
      - "v*-fluidez*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, e.g. 1.6-fluidez9"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

# Runners stay on Ubuntu 24.04: ubuntu-latest moves to Ubuntu 26 from
# 2026-10-19, and the builds are only validated on 24.04.
jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      release_notes: ${{ steps.notes.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release commit is on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$GITHUB_REF_NAME"
          fi
          VERSION="${VERSION#v}"
          # Devices only detect releases whose version keeps this shape
          # (src/network/OtaVersion.h), so reject anything else before building.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,3}-fluidez[0-9]{1,6}$'; then
            echo "::error::Release version '$VERSION' must look like 1.6-fluidez9"
            exit 1
          fi
          TRACKED="$(sed -n '/^\[fluidez\]$/,/^\[/s/^version = //p' platformio.ini)"
          if [ "$TRACKED" != "$VERSION" ]; then
            echo "::warning::platformio.ini [fluidez] version is '$TRACKED'; set it to '$VERSION' so local builds match this release."
          fi
          echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"

      # Fails before building when NOVIDADES.md has no section for this version.
      - name: Read release notes
        id: notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          NOTES="$(python3 scripts/release_notes.py "$RELEASE_VERSION")"
          {
            echo "release_notes<<FLUIDEZ_RELEASE_NOTES_EOF"
            printf '%s\n' "$NOTES"
            echo "FLUIDEZ_RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  build-release:
    needs: prepare-release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: default
            firmware: firmware-x3-x4
          - environment: sticky
            firmware: firmware-sticky
          - environment: x4-pro
            firmware: firmware-x4-pro
          - environment: x4-classic
            firmware: firmware-x4-classic
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          # Do not cache PlatformIO's Python virtual environment. It is tied to
          # the runner's Python and can become invalid when restored elsewhere.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Pin pioarduino core inside the platform penv
        env:
          PIO_ENV: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          # custom_sdkconfig runs a nested `pio run` from ~/.platformio/penv.
          # Keep that core on the same version as the outer core.
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e "$PIO_ENV"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Configure release version
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
        run: |
          sed -i "/^\[fluidez\]$/,/^\[/s/^version = .*/version = $RELEASE_VERSION/" platformio.ini

      - name: Build firmware
        env:
          FLUIDEZ_RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
        run: pio run -j1 -e ${{ matrix.environment }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-firmware-${{ matrix.environment }}
          path: .pio/build/${{ matrix.environment }}/${{ matrix.firmware }}-v${{ needs.prepare-release.outputs.release_version }}.bin
          if-no-files-found: error

  publish-release:
    needs:
      - prepare-release
      - build-release
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
    steps:
      # Checkout first: it cleans the workspace, which would remove downloaded files.
      - uses: actions/checkout@v6

      - name: Download firmware artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-firmware-*
          merge-multiple: true
          path: release-firmware

      # Devices only install assets named firmware-<type>*.bin, so the plugin ZIP
      # never interferes with Check for Updates.
      - name: Build Calibre plugin
        run: python3 scripts/build_calibre_plugin.py --output release-firmware/fluidez-reader-calibre-plugin.zip

      # Published (not draft or prerelease) and marked latest: the device's
      # releases/latest lookup ignores drafts and prereleases.
      # generate_release_notes stays off: pull requests are disabled in this
      # repository, and GitHub then refuses generated notes to the workflow token
      # (403 "Resource not accessible by integration"). The body links the commits.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: FluiDez Reader v${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          body: |
            ## Novidades

            ${{ needs.prepare-release.outputs.release_notes }}

            ## Como atualizar

            Atualize pelo próprio leitor em **Configurações > Sistema > Verificar atualizações**, ou copie o `.bin` do seu leitor para o cartão SD e use **Configurações > Sistema > Atualização de firmware do cartão SD**. Se a atualização pelo leitor falhar, use o cartão SD.

            > **Instalação e atualização por sua conta e risco.** A MJ Cloud Tecnologia não se responsabiliza por danos ao aparelho, perda de dados ou qualquer outro problema decorrente da instalação, da atualização ou do uso deste firmware.
            >
            > Testado apenas no Xteink X4 Pro. Os firmwares dos outros leitores são gerados a partir do mesmo código, mas não foram testados.

            | Leitor | Firmware |
            | --- | --- |
            | Xteink X4 Pro (testado) | `firmware-x4-pro-v${{ env.RELEASE_VERSION }}.bin` |
            | Xteink X4 Classic | `firmware-x4-classic-v${{ env.RELEASE_VERSION }}.bin` |
            | Xteink X3 / X4 | `firmware-x3-x4-v${{ env.RELEASE_VERSION }}.bin` |
            | Seeed Studio Sticky | `firmware-sticky-v${{ env.RELEASE_VERSION }}.bin` |

            ## Plugin para o Calibre

            Para enviar livros do Calibre pela rede Wi-Fi, instale o `fluidez-reader-calibre-plugin.zip` em **Preferências > Plugins > Carregar plugin a partir de arquivo** (sem extrair). Instruções: [calibre-plugin/README.md](https://github.com/${{ github.repository }}/blob/v${{ env.RELEASE_VERSION }}/calibre-plugin/README.md).

            Histórico técnico completo, em inglês: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/v${{ env.RELEASE_VERSION }}/CHANGELOG.md).

            **Commits**: https://github.com/${{ github.repository }}/commits/v${{ env.RELEASE_VERSION }}
          files: |
            release-firmware/firmware-x3-x4-v${{ env.RELEASE_VERSION }}.bin
            release-firmware/firmware-sticky-v${{ env.RELEASE_VERSION }}.bin
            release-firmware/firmware-x4-pro-v${{ env.RELEASE_VERSION }}.bin
            release-firmware/firmware-x4-classic-v${{ env.RELEASE_VERSION }}.bin
            release-firmware/fluidez-reader-calibre-plugin.zip
