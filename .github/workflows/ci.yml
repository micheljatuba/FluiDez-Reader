name: CI (build)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit supersedes older PR validation; keep main pushes independent.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Runners stay on Ubuntu 24.04: ubuntu-latest moves to Ubuntu 26 from
# 2026-10-19, and the builds are only validated on 24.04.
jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  release-notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Test release notes script
        run: python3 -m unittest discover -s test/scripts -p test_release_notes.py -v

      # Release pages open with the NOVIDADES.md section of their version, so the
      # version in platformio.ini needs one before it is tagged.
      - name: Check NOVIDADES.md for the platformio.ini version
        run: |
          VERSION="$(sed -n '/^\[crossink\]$/,/^\[/s/^version = //p' platformio.ini)"
          python3 scripts/release_notes.py "$VERSION" > /dev/null

  # Releases attach this ZIP, so a plugin that stops compiling fails here first.
  calibre-plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build Calibre plugin
        run: python3 scripts/build_calibre_plugin.py

  cppcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          # Do not cache PlatformIO's Python virtual environment. It is tied to
          # the runner's Python and can become invalid when restored elsewhere.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Run cppcheck
        run: pio check --fail-on-defect low --fail-on-defect medium --fail-on-defect high

  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test web file manager and browser image encoders
        run: node --test test/web_file_manager/browser_test.js test/pxc_v2/browser_test.js

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      # PersistableStoreAtomicTest compiles against the simulator's Arduino shims.
      - name: Install simulator libraries
        run: pio pkg install -e simulator

      - name: Install host test dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libexpat1-dev zlib1g-dev

      - name: Check the SD-card font catalog
        run: |
          python3 -m pip install --user pyyaml
          python3 -m unittest discover -s test/scripts -p test_sd_fonts_config.py -v

      - name: Build and run host unit tests
        run: |
          cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test
          ctest --test-dir build/test --output-on-failure -j "$(nproc)"

  x4-pro-simulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Linux simulator sample: GCC narrowing flag and OpenSSL for MD5.
      PLATFORMIO_BUILD_FLAGS: "-Wno-narrowing -lssl -lcrypto"
      PLATFORMIO_SETTING_ENABLE_TELEMETRY: "no"
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Install Linux simulator dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsdl2-dev libssl-dev curl

      - name: Test smoke runner
        run: |
          set -euo pipefail
          mkdir -p simulator-smoke-logs
          python -m unittest discover -s test/scripts -p test_run_simulator_smoke_test.py -v 2>&1 | tee simulator-smoke-logs/runner-tests.log

      - name: Build X4 Pro simulator
        timeout-minutes: 15
        run: |
          set -euo pipefail
          pio run -j2 -e x4-pro-simulator 2>&1 | tee simulator-smoke-logs/build.log

      - name: Smoke X4 Pro (default theme)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python scripts/run_simulator_smoke_test.py --env x4-pro-simulator --no-build --timeout 120 2>&1 | tee simulator-smoke-logs/default.log

      - name: Smoke X4 Pro (Classic)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python scripts/run_simulator_smoke_test.py --env x4-pro-simulator --no-build --timeout 120 --theme classic 2>&1 | tee simulator-smoke-logs/classic.log

      - name: Smoke X4 Pro (Dashboard)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python scripts/run_simulator_smoke_test.py --env x4-pro-simulator --no-build --timeout 120 --theme dashboard 2>&1 | tee simulator-smoke-logs/dashboard.log

      - name: Upload simulator failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: x4-pro-simulator-smoke-logs
          path: simulator-smoke-logs/
          if-no-files-found: warn
          retention-days: 7

  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment: [default, x4-pro]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          # Do not cache PlatformIO's Python virtual environment. It is tied to
          # the runner's Python and can become invalid when restored elsewhere.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build ${{ matrix.environment }} firmware
        run: |
          set -euo pipefail
          pio run -j1 -e ${{ matrix.environment }} | tee pio-${{ matrix.environment }}.log

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          {
            echo "## ${{ matrix.environment }} firmware build stats"
            grep -E "RAM:\s|Flash:\s" pio-${{ matrix.environment }}.log | while read -r line; do echo "- ${line}"; done
          } >> "$GITHUB_STEP_SUMMARY"

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build
      - calibre-plugin
      - clang-format
      - cppcheck
      - release-notes
      - unit-tests
      - x4-pro-simulator-smoke
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
