name: Relatar problema
description: Relate um erro ou comportamento inesperado do FluiDez Reader
title: "Título curto e descritivo do problema"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar o problema! Preencha os detalhes abaixo para que ele possa ser reproduzido.

        O FluiDez Reader foi testado apenas no Xteink X4 Pro. Relatos de outros aparelhos são bem-vindos, mas podem demorar mais para serem analisados.

  - type: dropdown
    id: device-type
    attributes:
      label: Aparelho
      description: Qual aparelho apresenta o problema?
      options:
        - "--- Selecione ---"
        - X4 Pro
        - X4
        - X3
        - X4 Classic
        - Seeed Sticky
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versão
      description: Qual versão do FluiDez Reader está instalada?
      placeholder: "Ex.: v1.6-fluidez8"
    validations:
      required: true

  - type: dropdown
    id: epub-state
    attributes:
      label: Otimização do EPUB
      description: O EPUB foi otimizado?
      options:
        - "--- Selecione ---"
        - "Não / não se aplica"
        - "Sim, com o otimizador de EPUB da transferência web do aparelho"
        - "Sim, com outro otimizador de EPUB"
        - "O que é um otimizador de EPUB?"
    validations:
      required: true

  - type: dropdown
    id: cache-state
    attributes:
      label: Cache
      description: Você tentou limpar algum dado em cache?
      options:
        - "--- Selecione ---"
        - "Não / não se aplica"
        - "Sim, o cache do livro (Menu do leitor > Excluir cache do livro)"
        - "Sim, o cache de leitura (Configurações > Sistema > Limpar cache de leitura)"
        - "Sim, o cache do aparelho (pasta .crosspoint no cartão SD)"
        - "Todas as opções acima"
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Descrição do problema
      description: Descreva o problema de forma clara e objetiva.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Passos para reproduzir
      description: Liste os passos necessários para reproduzir o comportamento inesperado.
      placeholder: |
        1. Vá em '...'
        2. Selecione '...'
        3. O aparelho trava
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Comportamento esperado
      description: Descreva o que você esperava que acontecesse.
    validations:
      required: true

  - type: dropdown
    id: epub-attachment
    attributes:
      label: Arquivo
      description: "Se o problema envolve um arquivo específico (EPUB, XTC etc.), anexe o arquivo exato nesta issue. **_Arquivos EPUB e XTC precisam ser compactados em .zip para serem anexados._**"
      options:
        - "--- Selecione ---"
        - "Não se aplica"
        - "Anexei o arquivo"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs e capturas de tela
      description: "Se houver, inclua mensagens de erro ou logs que ajudem a explicar o problema. Se o arquivo crash_report.txt foi gerado no cartão SD, inclua-o aqui. Você pode arrastar e soltar imagens aqui."
      render: shell
